<style>

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 40px; }

  .stat-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:14px; margin-top:18px; }
  @media (min-width:560px){ .stat-grid{ grid-template-columns: repeat(4,1fr);} }
  .stat-label { font-size:10px; opacity:.55; margin-bottom:3px; }
  .stat-value { font-size:18px; font-weight:500; }
  .stat-value input { background:transparent; border:none; border-bottom:1px dotted rgba(30,41,59,.3); outline:none; font-size:18px; font-weight:500; color:#1E293B; width:90px; }

  .card { background:#fff; border:1px solid #DEE0D5; border-radius:2px; overflow:hidden; box-shadow:0 1px 0 0 #DEE0D5; }
  .p-head { display:flex; align-items:baseline; justify-content:space-between; padding:12px 16px; background:#E8E4D6; border-bottom:2px solid rgba(169,130,45,.5); flex-wrap:wrap; gap:6px; }

  .section { padding: 12px 16px 0; }

  h2.sub { font-family:'Noto Serif Thai',serif; font-size:18px; color:#1E293B; margin:0; }

  .ct-sum .rmcard { margin-left:auto; background:none; border:none; color:#B4B7A9; display:flex; align-items:center; gap:4px; font-size:11.5px; }
  .ct-sum .rmcard:hover { color:#B3261E; }
  .progress-wrap { padding:12px 16px 2px; }
  .progress-labels { display:flex; justify-content:space-between; font-size:11px; color:#8A8D82; margin-bottom:6px; }
  .progress-bar { height:6px; border-radius:99px; background:#EEEFE9; overflow:hidden; }
  .progress-fill { height:100%; background:#B3261E; transition:width .3s; }
  .stamps { display:flex; flex-wrap:wrap; gap:12px; padding:14px 16px 4px; }
  .stamp-wrap { position:relative; }
  .stamp { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; }
  .stamp .circle { width:44px; height:44px; border-radius:50%; border:2px solid #C7CABF; display:flex; align-items:center; justify-content:center; font-size:11px; color:#8A8D82; background:#fff; font-family:'IBM Plex Mono',monospace; }
  .stamp .circle.paid { border-color:#B3261E; color:#B3261E; background:rgba(179,38,30,.05); transform:rotate(-8deg); box-shadow:0 0 0 1.5px rgba(179,38,30,.25); }
  .stamp .cap { font-size:9px; letter-spacing:.02em; color:#A6A99D; }
  .stamp .cap.paid { color:#B3261E; }
  .stamp-rm { position:absolute; top:-4px; right:-4px; background:#fff; border:1px solid #DEE0D5; border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center; color:#B4B7A9; font-size:10px; line-height:1; }
  .stamp-rm:hover { color:#B3261E; }
  .add-month { display:flex; flex-direction:column; align-items:center; gap:3px; justify-content:center; }
  .add-month input { height:44px; width:44px; border-radius:50%; border:2px dashed #C7CABF; text-align:center; font-size:10px; outline:none; }
  .add-month input:focus { border-color:rgba(30,41,59,.5); }
  .add-month button { background:none; border:none; font-size:9px; color:#8A8D82; }
  .ct-remain { display:flex; align-items:center; justify-content:space-between; margin:14px 16px 16px; padding-top:10px; border-top:1px dashed #EEEFE9; font-size:12.5px; }
  .ct-remain span:first-child { color:#5A5D51; }
  .ct-remain .val { font-size:16px; font-weight:600; color:#2A2E24; }

  .icon { display:inline-block; vertical-align:-2px; }
  .cards-list { display:flex; flex-direction:column; gap:16px; margin-bottom:20px; }
</style>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyAxijI_T_w4n26JMFmoTuYWlTyaJJkjio8",
    authDomain: "my-budget-app-1563c.firebaseapp.com",
    databaseURL: "https://my-budget-app-1563c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "my-budget-app-1563c",
    storageBucket: "my-budget-app-1563c.firebasestorage.app",
    messagingSenderId: "817244924368",
    appId: "1:817244924368:web:6d35c63feed3ee076fb1d5",
    measurementId: "G-FK628F84KM"
  };

  firebase.initializeApp(firebaseConfig);
  var dbRef = firebase.database().ref("budget_data");

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function thb(n){ n = isFinite(n) ? n : 0; return n.toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

  var ICONS = {
    wallet: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',
    piggy: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h3v-2h3v2h3v-2.3c1.5-.5 2.5-1.5 3-3H21a1 1 0 0 0 1-1v-3l-3-1V5Z"/></svg>',
    card: '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
    plus: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
    trash: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    reset: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    chevDown: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
    chevUp: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>',
    link: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg>'
  };

  function expenseSet(){
    return [
      {id:uid(),name:"แม่",amount:2000},
      {id:uid(),name:"เบี้ยประกันรถ",amount:392},
      {id:uid(),name:"ทรู",amount:755},
      {id:uid(),name:"YT & APM",amount:159},
      {id:uid(),name:"CardX",amount:3689,cardXAuto:true},
      {id:uid(),name:"ประกันอุบัติเหตุ",amount:315},
      {id:uid(),name:"ประกันอุบัติเหตุ",amount:320}
    ];
  }
  function investSet(){
    return [ {id:uid(),name:"กองทุน",amount:1000}, {id:uid(),name:"ETF",amount:1250} ];
  }
  function monthsFrom(labels, paidCount){
    return labels.map(function(l,i){ return {id:uid(), label:l, paid:i<paidCount}; });
  }

  function defaultData(){
    return {
      salary: 31450,
      ssoDeduction: 875,
      periods: [
        {id:uid(), label:"งวดที่ 1", dayLabel:"D5", income:15287.5, open:true, expenses:expenseSet(), investments:investSet()},
        {id:uid(), label:"งวดที่ 2", dayLabel:"D20", income:15287.5, open:true, expenses:expenseSet(), investments:investSet()}
      ],
      cards: [
        {id:uid(), name:"CardX", note:"ผ่อนหลัก", totalAmount:38600, monthlyAmount:3860, interest:"16%", open:true,
         months: monthsFrom(["4/26","5/26","6/26","7/26","8/26","9/26","10/26","11/26","12/26","1/27"], 4)},
        {id:uid(), name:"CardX", note:"Oppo", totalAmount:10000, monthlyAmount:1000, interest:"0%", open:true,
         months: monthsFrom(["7/26","8/26","9/26","10/26","11/26","12/26","1/27","2/27","3/27","4/27"], 1)},
        {id:uid(), name:"CardX", note:"หัวหิน", totalAmount:10068, monthlyAmount:2517, interest:"0%", open:true,
         months: monthsFrom(["8/26","9/26","10/26","11/26"], 0)}
      ]
    };
  }

  var state = null;
  var saveTimer = null;
  var saveStatus = "";
  var isRemoteUpdating = false;

  function initFirebaseSync(){
    saveStatus = "กำลังโหลด...";
    renderStatusOnly();

    dbRef.on("value", function(snapshot){
      var val = snapshot.val();
      if(val){
        state = val;
        migrateCardXAuto(state);
      } else {
        state = defaultData();
        dbRef.set(state);
      }
      isRemoteUpdating = true;
      render();
      isRemoteUpdating = false;
      saveStatus = "";
      renderStatusOnly();
    }, function(err){
      saveStatus = "เชื่อมต่อฐานข้อมูลไม่สำเร็จ";
      renderStatusOnly();
    });
  }

  function save(){
    if(isRemoteUpdating) return;
    saveStatus = "กำลังบันทึก...";
    renderStatusOnly();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      dbRef.set(state).then(function(){
        saveStatus = "บันทึกแล้ว";
        renderStatusOnly();
        setTimeout(function(){ if(saveStatus==="บันทึกแล้ว"){ saveStatus=""; renderStatusOnly(); } }, 1500);
      }).catch(function(e){
        saveStatus = "บันทึกไม่สำเร็จ";
        renderStatusOnly();
      });
    }, 500);
  }

  function renderStatusOnly(){
    var el = document.getElementById("save-status");
    if(!el) return;
    el.className = "save-status" + (saveStatus==="บันทึกไม่สำเร็จ" || saveStatus.indexOf("ไม่สำเร็จ") !== -1 ? " err" : "");
    el.textContent = saveStatus;
  }

  function getPath(obj, path){
    var parts = path.split(".");
    var cur = obj;
    for(var i=0;i<parts.length;i++){ if(cur) cur = cur[parts[i]]; }
    return cur;
  }
  function setPath(obj, path, value){
    var parts = path.split(".");
    var cur = obj;
    for(var i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
    if(cur) cur[parts[parts.length-1]] = value;
  }

  function cardStatus(c){
    if(!c || !c.months) return {paidCount:0, remaining:0, pct:0};
    var paidCount = c.months.filter(function(m){return m.paid;}).length;
    var paidAmount = paidCount * (Number(c.monthlyAmount)||0);
    var remaining = Math.max((Number(c.totalAmount)||0) - paidAmount, 0);
    var pct = c.months.length ? Math.round(paidCount/c.months.length*100) : 0;
    return {paidCount:paidCount, remaining:remaining, pct:pct};
  }
  function activeCardMonthlySum(state){
    if(!state || !state.cards) return 0;
    return state.cards.reduce(function(s,c){
      var st = cardStatus(c);
      return s + (st.remaining > 0 ? (Number(c.monthlyAmount)||0) : 0);
    }, 0);
  }
  function cardXPerPeriod(state){
    var n = (state && state.periods) ? state.periods.length : 1;
    return activeCardMonthlySum(state) / (n || 1);
  }
  function effectiveAmount(item, computedCardX){
    return item.cardXAuto ? computedCardX : (Number(item.amount)||0);
  }
  function periodTotals(p, computedCardX){
    var exp = p.expenses ? p.expenses.reduce(function(s,i){return s+effectiveAmount(i, computedCardX);},0) : 0;
    var inv = p.investments ? p.investments.reduce(function(s,i){return s+(Number(i.amount)||0);},0) : 0;
    return {exp:exp, inv:inv, remaining:(Number(p.income)||0) - exp - inv};
  }
  function migrateCardXAuto(state){
    if(!state || !state.periods) return;
    state.periods.forEach(function(p){
      if(!p.expenses) return;
      var hasAuto = p.expenses.some(function(i){ return i.cardXAuto; });
      if(hasAuto) return;
      var match = p.expenses.find(function(i){ return (i.name||"").trim().toLowerCase() === "cardx"; });
      if(match) match.cardXAuto = true;
    });
  }

  function renderLineRow(item, idx, path, accentClass, opts){
    opts = opts || {};
    var isAuto = !!item.cardXAuto;
    var displayAmount = isAuto ? (opts.computedCardX||0) : item.amount;
    var linkBtn = opts.linkable ? (
      '<button class="link-btn' + (isAuto?' on':'') + '" data-action="toggle-cardx-link" data-path="' + path + '" data-idx="' + idx + '" ' +
        'title="' + (isAuto ? 'ผูกกับยอดบัตรเครดิตอัตโนมัติอยู่ (คลิกเพื่อยกเลิก)' : 'ผูกรายการนี้กับยอดผ่อนบัตรเครดิตอัตโนมัติ') + '">' + ICONS.link + '</button>'
    ) : '';
    return '' +
      '<div class="line-row' + (isAuto?' auto-row':'') + '" data-idx="' + idx + '">' +
        linkBtn +
        '<input class="name" data-bind="' + path + '.' + idx + '.name" value="' + esc(item.name) + '" placeholder="รายการ" />' +
        (isAuto ? '<span class="auto-badge">อัตโนมัติ</span>' : '') +
        '<div class="amt"><span>฿</span><input class="amount ' + accentClass + '" type="number" data-model="' + path + '.' + idx + '.amount" value="' + displayAmount + '"' + (isAuto?' disabled':'') + ' /></div>' +
        '<button class="rm" data-action="remove-item" data-path="' + path + '" data-idx="' + idx + '">' + ICONS.trash + '</button>' +
      '</div>';
  }

  function renderPeriod(p, pIdx, computedCardX){
    var t = periodTotals(p, computedCardX);
    var expPath = "periods." + pIdx + ".expenses";
    var invPath = "periods." + pIdx + ".investments";
    var rows = (p.expenses || []).map(function(it,i){ return renderLineRow(it, i, expPath, "red", {linkable:true, computedCardX:computedCardX}); }).join("");
    var invRows = (p.investments || []).map(function(it,i){ return renderLineRow(it, i, invPath, "green"); }).join("");
    return '' +
    '<div class="card" data-pidx="' + pIdx + '">' +
      '<div class="p-head">' +
        '<div class="left"><span class="serif" style="font-size:15px">' + esc(p.label) + '</span>' +
        '<input class="daylabel" data-bind="periods.' + pIdx + '.dayLabel" value="' + esc(p.dayLabel) + '" /></div>' +
        '<div class="income"><span>เงินเข้างวดนี้</span><span>฿</span>' +
          '<input type="number" data-model="periods.' + pIdx + '.income" value="' + p.income + '" /></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-title">' + ICONS.wallet + ' ค่าใช้จ่าย</div>' +
        '<div class="link-hint">' + ICONS.link + ' สามารถพิมพ์แก้ไขตัวเลขเองได้ หรือคลิกไอคอนโซ่เพื่อผูกยอดกับบัตรเครดิตอัตโนมัติ</div>' +
        rows +
        '<button class="add-line" data-action="add-item" data-path="' + expPath + '">' + ICONS.plus + ' เพิ่มรายการ</button>' +
        '<div class="total-row"><span>รวมค่าใช้จ่าย</span><b class="mono" style="color:#B3261E" id="exp-total-' + pIdx + '">฿' + thb(t.exp) + '</b></div>' +
      '</div>' +
      '<div class="section" style="border-top:1px solid #EEEFE9">' +
        '<div class="section-title">' + ICONS.piggy + ' เงินลงทุน</div>' +
        invRows +
        '<button class="add-line" data-action="add-item" data-path="' + invPath + '">' + ICONS.plus + ' เพิ่มรายการ</button>' +
        '<div class="total-row"><span>รวมเงินลงทุน</span><b class="mono" style="color:#1F7A53" id="inv-total-' + pIdx + '">฿' + thb(t.inv) + '</b></div>' +
      '</div>' +
      '<div class="remain"><span>คงเหลือหลังหักทุกอย่าง</span><span class="val mono" id="period-remain-' + pIdx + '" style="color:' + (t.remaining<0?'#B3261E':'#1E293B') + '">฿' + thb(t.remaining) + '</span></div>' +
    '</div>';
  }

  function renderCard(c, cIdx){
    var st = cardStatus(c);
    var stamps = (c.months || []).map(function(m, mIdx){
      return '' +
      '<div class="stamp-wrap">' +
        '<button class="stamp" data-action="toggle-month" data-cidx="' + cIdx + '" data-midx="' + mIdx + '">' +
          '<span class="circle' + (m.paid?' paid':'') + '">' + esc(m.label) + '</span>' +
          '<span class="cap' + (m.paid?' paid':'') + '">' + (m.paid?'จ่ายแล้ว':'รอจ่าย') + '</span>' +
        '</button>' +
        '<button class="stamp-rm" data-action="remove-month" data-cidx="' + cIdx + '" data-midx="' + mIdx + '">×</button>' +
      '</div>';
    }).join("");

    var body = c.open ? ('' +
      '<div class="stamps">' + stamps +
        '<div class="add-month">' +
          '<input type="text" placeholder="ม/ปี" id="newmonth-' + cIdx + '" />' +
          '<button data-action="add-month" data-cidx="' + cIdx + '">+ งวด</button>' +
        '</div>' +
      '</div>' +
      '<div class="ct-remain"><span>ยอดคงเหลือ</span><span class="val mono">฿' + thb(st.remaining) + '</span></div>'
    ) : '';

    return '' +
    '<div class="card">' +
      '<div class="ct-head">' +
        '<div class="left">' + ICONS.card +
          '<input class="cname" data-bind="cards.' + cIdx + '.name" value="' + esc(c.name) + '" />' +
          '<input class="cnote" data-bind="cards.' + cIdx + '.note" value="' + esc(c.note) + '" placeholder="หมายเหตุ" />' +
          '<span class="interest">ดอก <input style="width:34px;background:transparent;border:none;border-bottom:1px dotted rgba(30,41,59,.25);outline:none;font-size:10px;color:rgba(30,41,59,.5)" data-bind="cards.' + cIdx + '.interest" value="' + esc(c.interest) + '" /></span>' +
        '</div>' +
        '<button class="toggle" data-action="toggle-card-open" data-cidx="' + cIdx + '">' + (c.open?ICONS.chevUp:ICONS.chevDown) + '</button>' +
      '</div>' +
      '<div class="ct-sum">' +
        '<span>ยอดรวม <input type="number" data-model="cards.' + cIdx + '.totalAmount" value="' + c.totalAmount + '" /></span>' +
        '<span>/เดือน <input type="number" data-model="cards.' + cIdx + '.monthlyAmount" value="' + c.monthlyAmount + '" /></span>' +
        '<button class="rmcard" data-action="remove-card" data-cidx="' + cIdx + '">' + ICONS.trash + ' ลบบัตร</button>' +
      '</div>' +
      '<div class="progress-wrap">' +
        '<div class="progress-labels"><span>จ่ายแล้ว ' + st.paidCount + '/' + (c.months ? c.months.length : 0) + ' งวด</span><span>' + st.pct + '%</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + st.pct + '%"></div></div>' +
      '</div>' +
      body +
    '</div>';
  }

  function render(){
    if(!state) return;
    var netSalary = (Number(state.salary)||0) - (Number(state.ssoDeduction) || 0);
    var totalOutstanding = (state.cards || []).reduce(function(s,c){ return s + cardStatus(c).remaining; },0);

    var computedCardX = cardXPerPeriod(state);

    var html = '' +
    '<div class="cover"><div class="cover-inner">' +
      '<div class="cover-top">' +
        '<div><div class="eyebrow">สมุดบัญชีรายรับ-รายจ่าย</div><h1 class="serif">งบประมาณรายเดือน</h1></div>' +
        '<button class="reset-btn" data-action="reset">' + ICONS.reset + ' รีเซ็ต</button>' +
      '</div>' +
      '<div class="stat-grid">' +
        '<div><div class="stat-label">เงินเดือน</div><div class="stat-value">฿<input type="number" data-model="salary" value="' + state.salary + '" /></div></div>' +
        '<div><div class="stat-label">หักประกันสังคม</div><div class="stat-value">฿<input type="number" data-model="ssoDeduction" value="' + state.ssoDeduction + '" style="width:70px" /></div></div>' +
        '<div><div class="stat-label">เงินเดือนสุทธิ</div><div class="stat-value mono" id="net-salary-val">฿' + thb(netSalary) + '</div></div>' +
        '<div><div class="stat-label">บัตรเครดิตคงค้างรวม</div><div class="stat-value mono" style="color:#B3261E">฿' + thb(totalOutstanding) + '</div></div>' +
      '</div>' +
    '</div></div>' +
    '<div class="wrap">' +
      '<div id="save-status" class="save-status"></div>' +
      '<div class="periods-grid">' + (state.periods || []).map(function(p,i){ return renderPeriod(p, i, computedCardX); }).join("") + '</div>' +
      '<div class="cards-header"><h2 class="sub serif">ผ่อนบัตรเครดิต</h2>' +
        '<button class="add-card-btn" data-action="add-card">' + ICONS.plus + ' เพิ่มบัตร</button></div>' +
      '<div class="cards-list">' + (state.cards || []).map(renderCard).join("") + '</div>' +
    '</div>';

    document.getElementById("app").innerHTML = html;
    renderStatusOnly();
  }

  function handleClick(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");

    if(action === "toggle-cardx-link"){
      var lpath = btn.getAttribute("data-path"), lidx = +btn.getAttribute("data-idx");
      var larr = getPath(state, lpath);
      var target = larr[lidx];
      var turningOn = !target.cardXAuto;
      if(turningOn){
        var computedNow = cardXPerPeriod(state);
        larr.forEach(function(it){ it.cardXAuto = false; });
        target.cardXAuto = true;
        target.amount = computedNow;
      } else {
        target.cardXAuto = false;
      }
    } else if(action === "remove-item"){
      var path = btn.getAttribute("data-path"), idx = +btn.getAttribute("data-idx");
      getPath(state, path).splice(idx,1);
    } else if(action === "add-item"){
      var path2 = btn.getAttribute("data-path");
      getPath(state, path2).push({id:uid(), name:"", amount:0});
    } else if(action === "toggle-month"){
      var c = state.cards[+btn.getAttribute("data-cidx")];
      var m = c.months[+btn.getAttribute("data-midx")];
      m.paid = !m.paid;
    } else if(action === "remove-month"){
      var c2 = state.cards[+btn.getAttribute("data-cidx")];
      c2.months.splice(+btn.getAttribute("data-midx"),1);
    } else if(action === "add-month"){
      var cidx = +btn.getAttribute("data-cidx");
      var input = document.getElementById("newmonth-" + cidx);
      var val = input ? input.value.trim() : "";
      if(!val) return;
      if(!state.cards[cidx].months) state.cards[cidx].months = [];
      state.cards[cidx].months.push({id:uid(), label:val, paid:false});
    } else if(action === "toggle-card-open"){
      var c3 = state.cards[+btn.getAttribute("data-cidx")];
      c3.open = !c3.open;
    } else if(action === "remove-card"){
      state.cards.splice(+btn.getAttribute("data-cidx"),1);
    } else if(action === "add-card"){
      if(!state.cards) state.cards = [];
      state.cards.push({id:uid(), name:"บัตรใหม่", note:"", totalAmount:0, monthlyAmount:0, interest:"0%", open:true, months:[]});
    } else if(action === "reset"){
      if(confirm("ล้างข้อมูลทั้งหมดและเริ่มใหม่ตามค่าเริ่มต้น?")){ state = defaultData(); }
      else return;
    }
    save();
    render();
  }

  function handleInput(e){
    var el = e.target;
    var modelPath = el.getAttribute("data-model");
    var bindPath = el.getAttribute("data-bind");
    
    // สำหรับช่องข้อความทั่วไป (ชื่อรายการ, หมายเหตุ) ใช้โครงสร้างเดิมโดยอัปเดต state และบันทึก
    if(bindPath){
      setPath(state, bindPath, el.value);
      save();
      return;
    }

    // สำหรับช่องตัวเลข (ใช้ data-model) อัปเดตค่าลงใน state และคำนวณผลรวมใหม่แบบ Realtime โดยไม่สั่ง render() ใหม่ทั้งหน้า
    if(modelPath){
      var val = el.value === "" ? 0 : (parseFloat(el.value) || 0);
      setPath(state, modelPath, val);
      save();
      updateLiveCalculations();
    }
  }

  function updateLiveCalculations(){
    if(!state) return;

    // คำนวณเงินเดือนสุทธิ
    var netSalary = (Number(state.salary)||0) - (Number(state.ssoDeduction)||0);
    var netEl = document.getElementById("net-salary-val");
    if(netEl) netEl.textContent = "฿" + thb(netSalary);

    var computedCardX = cardXPerPeriod(state);

    // อัปเดตตัวเลขในแต่ละงวด
    if(state.periods){
      state.periods.forEach(function(p, pIdx){
        var cardEl = document.querySelector('.card[data-pidx="' + pIdx + '"]');
        if(!cardEl) return;

        // ดึงค่ายอดใช้จ่ายทั้งหมดในงวดนี้จาก DOM ที่ผู้ใช้กรอก
        var expInputs = cardEl.querySelectorAll('.section:nth-of-type(1) input.amount');
        var totalExp = 0;
        expInputs.forEach(function(inp, i){
          var v = inp.value === "" ? 0 : (parseFloat(inp.value)||0);
          totalExp += v;
          if(p.expenses && p.expenses[i]) p.expenses[i].amount = v;
        });

        // ดึงค่ายอดลงทุนทั้งหมดในงวดนี้จาก DOM ที่ผู้ใช้กรอก
        var invInputs = cardEl.querySelectorAll('.section:nth-of-type(2) input.amount');
        var totalInv = 0;
        invInputs.forEach(function(inp, i){
          var v = inp.value === "" ? 0 : (parseFloat(inp.value)||0);
          totalInv += v;
          if(p.investments && p.investments[i]) p.investments[i].amount = v;
        });

        // อัปเดต UI ยอดรวมค่าใช้จ่ายและเงินลงทุน
        var expTotalEl = document.getElementById("exp-total-" + pIdx);
        if(expTotalEl) expTotalEl.textContent = "฿" + thb(totalExp);

        var invTotalEl = document.getElementById("inv-total-" + pIdx);
        if(invTotalEl) invTotalEl.textContent = "฿" + thb(totalInv);

        // คำนวณยอดคงเหลือจริง
        var currentExp = p.expenses ? p.expenses.reduce(function(s,i){return s+effectiveAmount(i, computedCardX);},0) : 0;
        var currentInv = p.investments ? p.investments.reduce(function(s,i){return s+(Number(i.amount)||0);},0) : 0;
        var rem = (Number(p.income)||0) - currentExp - currentInv;

        var remEl = document.getElementById("period-remain-" + pIdx);
        if(remEl){
          remEl.textContent = "฿" + thb(rem);
          remEl.style.color = rem < 0 ? "#B3261E" : "#1E293B";
        }
      });
    }
  }

  document.addEventListener("click", handleClick);
  document.addEventListener("input", handleInput);

  initFirebaseSync();

})();
</script>
</body>
</html>
