  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function thb(n){ n = isFinite(n) ? n : 0; return n.toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

  var ICONS = {
    wallet: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',
    piggy: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h3v-2h3v2h3v-2.3c1.5-.5 2.5-1.5 3-3H21a1 1 0 0 0 1-1v-3l-3-1V5Z"/></svg>',
    card: '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
    plus: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
    trash: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    reset: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    undo: '<svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>',
    chevDown: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
    chevUp: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>',
    link: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg>',
    archive: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>'
  };

  function expenseSet(){
    return [
      {id:uid(),name:"แม่",amount:2000},
      {id:uid(),name:"เบี้ยประกันรถ",amount:392},
      {id:uid(),name:"ทรู",amount:755},
      {id:uid(),name:"YT & APM",amount:159},
      {id:uid(),name:"CardX",amount:3689,cardXAuto:true},
      {id:uid(),name:"ประกันอุบัติเหตุ",amount:315},
      {id:uid(),name:"ประกันอุบัติเหตุ",amount:320}
    ];
  }
  function investSet(){
    return [ {id:uid(),name:"กองทุน",amount:1000}, {id:uid(),name:"ETF",amount:1250} ];
  }
  function monthsFrom(labels, paidCount){
    return labels.map(function(l,i){ return {id:uid(), label:l, paid:i<paidCount}; });
  }

  function defaultCurrentData(){
    var netDefault = 31450 - 875;
    var perPeriod = netDefault / 2;
    return {
      salary: 31450,
      ssoDeduction: 875,
      extraIncome: 0,
      allowanceIncome: 0,
      periods: [
        {id:uid(), label:"งวดที่ 1", dayLabel:"D5", income:perPeriod, open:true, expenses:expenseSet(), investments:investSet()},
        {id:uid(), label:"งวดที่ 2", dayLabel:"D20", income:perPeriod, open:true, expenses:expenseSet(), investments:investSet()}
      ],
      cards: [
        {id:uid(), name:"CardX", note:"ผ่อนหลัก", totalAmount:38600, monthlyAmount:3860, interest:"16%", open:true,
         months: monthsFrom(["4/26","5/26","6/26","7/26","8/26","9/26","10/26","11/26","12/26","1/27"], 4)},
        {id:uid(), name:"CardX", note:"Oppo", totalAmount:10000, monthlyAmount:1000, interest:"0%", open:true,
         months: monthsFrom(["7/26","8/26","9/26","10/26","11/26","12/26","1/27","2/27","3/27","4/27"], 1)},
        {id:uid(), name:"CardX", note:"หัวหิน", totalAmount:10068, monthlyAmount:2517, interest:"0%", open:true,
         months: monthsFrom(["8/26","9/26","10/26","11/26"], 0)}
      ]
    };
  }

  function defaultData(){
    return {
      selectedMonth: "08/2569",
      history: {
        "08/2569": defaultCurrentData()
      }
    };
  }

  var state = null;
  var undoStack = [];
  var saveTimer = null;
  var saveStatus = "";
  var isRemoteUpdating = false;

  function pushUndo(){
    if(!state) return;
    undoStack.push(JSON.parse(JSON.stringify(state)));
    if(undoStack.length > 30) undoStack.shift();
    updateUndoButtonState();
  }

  function updateUndoButtonState(){
    var btn = document.getElementById("undo-btn");
    if(btn) btn.disabled = undoStack.length === 0;
  }

  function getCurrentMonthData(){
    if(!state) return null;
    if(!state.history) state.history = {};
    if(!state.selectedMonth) state.selectedMonth = "08/2569";
    if(!state.history[state.selectedMonth]){
      state.history[state.selectedMonth] = defaultCurrentData();
    }
    return state.history[state.selectedMonth];
  }

  function initFirebaseSync(){
    saveStatus = "กำลังโหลดข้อมูลล่าสุด...";
    renderStatusOnly();

    dbRef.on("value", function(snapshot){
      if(isRemoteUpdating) return;
      var val = snapshot.val();
      if(val){
        state = val;
        // Migration สำหรับโครงสร้างเก่าที่ยังไม่มีระบบประวัติรายเดือน
        if(!state.history){
          var oldData = JSON.parse(JSON.stringify(state));
          state = {
            selectedMonth: "08/2569",
            history: {
              "08/2569": oldData
            }
          };
        }
        if(!state.selectedMonth) state.selectedMonth = "08/2569";
        var cur = getCurrentMonthData();
        migrateCardXAuto(cur);
      } else {
        state = defaultData();
        dbRef.set(state);
      }
      undoStack = [];
      render();
    }, function(err){
      saveStatus = "เชื่อมต่อฐานข้อมูลไม่สำเร็จ";
      renderStatusOnly();
    });
  }

  function save(){
    saveStatus = "กำลังบันทึก...";
    renderStatusOnly();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      isRemoteUpdating = true;
      dbRef.set(state).then(function(){
        isRemoteUpdating = false;
        saveStatus = "บันทึกเรียบร้อย";
        renderStatusOnly();
        setTimeout(function(){ if(saveStatus==="บันทึกเรียบร้อย"){ saveStatus=""; renderStatusOnly(); } }, 1500);
      }).catch(function(e){
        isRemoteUpdating = false;
        saveStatus = "บันทึกไม่สำเร็จ";
        renderStatusOnly();
      });
    }, 400);
  }

  function renderStatusOnly(){
    var el = document.getElementById("save-status");
    if(!el) return;
    el.className = "save-status" + (saveStatus==="บันทึกไม่สำเร็จ" || saveStatus.indexOf("ไม่สำเร็จ") !== -1 ? " err" : "");
    el.textContent = saveStatus;
  }

  function cardStatus(c){
    if(!c || !c.months) return {paidCount:0, remaining:0, pct:0};
    var paidCount = c.months.filter(function(m){return m.paid;}).length;
    var paidAmount = paidCount * (Number(c.monthlyAmount)||0);
    var remaining = Math.max((Number(c.totalAmount)||0) - paidAmount, 0);
    var pct = c.months.length ? Math.round(paidCount/c.months.length*100) : 0;
    return {paidCount:paidCount, remaining:remaining, pct:pct};
  }
  function activeCardMonthlySum(cur){
    if(!cur || !cur.cards) return 0;
    return cur.cards.reduce(function(s,c){
      var st = cardStatus(c);
      return s + (st.remaining > 0 ? (Number(c.monthlyAmount)||0) : 0);
    }, 0);
  }
  function cardXPerPeriod(cur){
    var n = (cur && cur.periods) ? cur.periods.length : 1;
    return activeCardMonthlySum(cur) / (n || 1);
  }
  function effectiveAmount(item, computedCardX){
    return item.cardXAuto ? computedCardX : (Number(item.amount)||0);
  }
  function periodTotals(p, computedCardX){
    var exp = p.expenses ? p.expenses.reduce(function(s,i){return s+effectiveAmount(i, computedCardX);},0) : 0;
    var inv = p.investments ? p.investments.reduce(function(s,i){return s+(Number(i.amount)||0);},0) : 0;
    return {exp:exp, inv:inv, remaining:(Number(p.income)||0) - exp - inv};
  }
  function migrateCardXAuto(cur){
    if(!cur || !cur.periods) return;
    cur.periods.forEach(function(p){
      if(!p.expenses) return;
      var hasAuto = p.expenses.some(function(i){ return i.cardXAuto; });
      if(hasAuto) return;
      var match = p.expenses.find(function(i){ return (i.name||"").trim().toLowerCase() === "cardx"; });
      if(match) match.cardXAuto = true;
    });
  }

  function liveUpdateTotals(){
    if(!state) return;
    var cur = getCurrentMonthData();

    document.querySelectorAll("input[data-bind], select[data-bind]").forEach(function(input){
      var bind = input.getAttribute("data-bind");
      var val = input.type === "number" ? (input.value === "" ? 0 : parseFloat(input.value)) : input.value;
      if(bind.indexOf("selectedMonth") === 0){
        state.selectedMonth = val;
      } else {
        setDeepValue(cur, bind, val);
      }
    });

    var baseSalary = (Number(cur.salary)||0) - (Number(cur.ssoDeduction)||0);
    var extra = Number(cur.extraIncome)||0;
    var allowance = Number(cur.allowanceIncome)||0;
    var totalNetIncome = baseSalary + extra + allowance;

    var netEl = document.getElementById("net-salary-val");
    if(netEl) netEl.textContent = "฿" + thb(totalNetIncome);

    var totalOutstanding = (cur.cards || []).reduce(function(s,c){ return s + cardStatus(c).remaining; },0);
    var totalOutEl = document.getElementById("total-outstanding-val");
    if(totalOutEl) totalOutEl.textContent = "฿" + thb(totalOutstanding);

    var numPeriods = (cur.periods || []).length || 1;
    var perPeriodIncome = totalNetIncome / numPeriods;
    (cur.periods || []).forEach(function(p, pIdx){
      p.income = perPeriodIncome;
      var incInput = document.querySelector('input[data-bind="periods.' + pIdx + '.income"]');
      if(incInput && document.activeElement !== incInput){
        incInput.value = perPeriodIncome;
      }
    });

    var computedCardX = cardXPerPeriod(cur);

    document.querySelectorAll(".line-row.auto-row input.amount").forEach(function(inp){
      inp.value = computedCardX;
    });

    (cur.periods || []).forEach(function(p, pIdx){
      var t = periodTotals(p, computedCardX);

      var expEl = document.getElementById("total-exp-" + pIdx);
      if(expEl) expEl.textContent = "฿" + thb(t.exp);

      var invEl = document.getElementById("total-inv-" + pIdx);
      if(invEl) invEl.textContent = "฿" + thb(t.inv);

      var remEl = document.getElementById("remain-" + pIdx);
      if(remEl){
        remEl.textContent = "฿" + thb(t.remaining);
        remEl.style.color = t.remaining < 0 ? "#B3261E" : "#1E293B";
      }
    });

    updateCombinedSummaryUI(computedCardX, totalNetIncome);
  }

  function getAvailableMonths(){
    if(!state || !state.history) return ["08/2569"];
    var keys = Object.keys(state.history);
    if(keys.indexOf("08/2569") === -1) keys.push("08/2569");
    
    // เรียงลำดับเดือน/ปี (เช่น 08/2569, 09/2569 ...)
    keys.sort(function(a,b){
      var pA = a.split("/");
      var pB = b.split("/");
      var numA = parseInt(pA[1]) * 100 + parseInt(pA[0]);
      var numB = parseInt(pB[1]) * 100 + parseInt(pB[0]);
      return numA - numB;
    });
    return keys;
  }

  }

  function setDeepValue(obj, path, val){
    var parts = path.split(".");
    var curr = obj;
    for(var i=0; i<parts.length-1; i++){
      var p = parts[i];
      if(!curr[p]) curr[p] = {};
      curr = curr[p];
    }
    curr[parts[parts.length-1]] = val;
  }

  // Event Listeners สำหรับการเปลี่ยนแปลงข้อมูลแบบ Real-time
  document.addEventListener("input", function(e){
    var target = e.target;
    var bind = target.getAttribute("data-bind");
    if(bind || target.classList.contains("amount") || target.classList.contains("period-income-input") || target.classList.contains("cname") || target.classList.contains("cnote") || target.classList.contains("daylabel")){
      liveUpdateTotals();
      pushUndo();
      save();
    }
  });

  document.addEventListener("change", function(e){
    var target = e.target;
    if(target && target.getAttribute("data-bind") === "selectedMonth"){
      pushUndo();
      state.selectedMonth = target.value;
      render();
      save();
    }
  });

  document.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");
    var cur = getCurrentMonthData();

    if(action === "undo"){
      if(undoStack.length === 0) return;
      state = undoStack.pop();
      updateUndoButtonState();
      render();
      save();
      return;
    }

    pushUndo();

    if(action === "reset-defaults"){
      if(confirm("ต้องการรีเซ็ตข้อมูลของเดือน " + state.selectedMonth + " กลับเป็นค่าเริ่มต้นหรือไม่?")){
        cur.salary = 31450;
        cur.ssoDeduction = 875;
        cur.extraIncome = 0;
        cur.allowanceIncome = 0;
        cur.periods = [
          {id:uid(), label:"งวดที่ 1", dayLabel:"D5", income:(31450-875)/2, open:true, expenses:expenseSet(), investments:investSet()},
          {id:uid(), label:"งวดที่ 2", dayLabel:"D20", income:(31450-875)/2, open:true, expenses:expenseSet(), investments:investSet()}
        ];
        render();
        save();
      }
    } else if(action === "add-item"){
      var path = btn.getAttribute("data-path");
      var parts = path.split(".");
      var targetArr = cur;
      for(var i=0; i<parts.length; i++){
        targetArr = targetArr[parts[i]];
      }
      targetArr.push({id:uid(), name:"", amount:0});
      render();
      save();
    } else if(action === "remove-item"){
      var path = btn.getAttribute("data-path");
      var idx = parseInt(btn.getAttribute("data-idx"));
      var parts = path.split(".");
      var targetArr = cur;
      for(var i=0; i<parts.length; i++){
        targetArr = targetArr[parts[i]];
      }
      targetArr.splice(idx, 1);
      render();
      save();
    } else if(action === "toggle-cardx-link"){
      var path = btn.getAttribute("data-path");
      var idx = parseInt(btn.getAttribute("data-idx"));
      var parts = path.split(".");
      var targetArr = cur;
      for(var i=0; i<parts.length; i++){
        targetArr = targetArr[parts[i]];
      }
      var item = targetArr[idx];
      item.cardXAuto = !item.cardXAuto;
      if(item.cardXAuto) item.name = "CardX";
      render();
      save();
    } else if(action === "toggle-card-open"){
      var cidx = parseInt(btn.getAttribute("data-cidx"));
      cur.cards[cidx].open = !cur.cards[cidx].open;
      render();
    } else if(action === "toggle-month"){
      var cidx = parseInt(btn.getAttribute("data-cidx"));
      var midx = parseInt(btn.getAttribute("data-midx"));
      var m = cur.cards[cidx].months[midx];
      m.paid = !m.paid;
      render();
      save();
    } else if(action === "remove-month"){
      var cidx = parseInt(btn.getAttribute("data-cidx"));
      var midx = parseInt(btn.getAttribute("data-midx"));
      cur.cards[cidx].months.splice(midx, 1);
      render();
      save();
    } else if(action === "add-month"){
      var cidx = parseInt(btn.getAttribute("data-cidx"));
      var inp = document.getElementById("newmonth-" + cidx);
      if(inp && inp.value.trim()){
        if(!cur.cards[cidx].months) cur.cards[cidx].months = [];
        cur.cards[cidx].months.push({id:uid(), label:inp.value.trim(), paid:false});
        render();
        save();
      }
    } else if(action === "add-card"){
      if(!cur.cards) cur.cards = [];
      cur.cards.push({
        id:uid(), name:"CardX", note:"รายการใหม่", totalAmount:0, monthlyAmount:0, interest:"0%", open:true,
        months: monthsFrom(["8/26","9/26"], 0)
      });
      render();
      save();
    } else if(action === "remove-card"){
      var cidx = parseInt(btn.getAttribute("data-cidx"));
      if(confirm("ต้องการลบบัตรเครดิตนี้หรือไม่?")){
        cur.cards.splice(cidx, 1);
        render();
        save();
      }
    } else if(action === "add-new-month"){
      var monthsList = getAvailableMonths();
      var lastMonth = monthsList[monthsList.length - 1]; // เช่น "08/2569"
      var parts = lastMonth.split("/");
      var mNum = parseInt(parts[0]) + 1;
      var yNum = parseInt(parts[1]);
      if(mNum > 12){
        mNum = 1;
        yNum += 1;
      }
      var nextMonthStr = (mNum < 10 ? "0" + mNum : mNum) + "/" + yNum;
      
      if(!state.history[nextMonthStr]){
        // ทำการโคลนข้อมูลจากเดือนล่าสุดมาเป็นตั้งต้นของเดือนใหม่เพื่อให้กรอกต่อง่ายขึ้น
        var clonedData = JSON.parse(JSON.stringify(cur));
        // รีเซ็ตรายได้เสริมในเดือนใหม่เป็น 0 หรือคงค่าเดิมก็ได้ตามต้องการ
        clonedData.extraIncome = 0;
        clonedData.allowanceIncome = 0;
        state.history[nextMonthStr] = clonedData;
      }
      state.selectedMonth = nextMonthStr;
      render();
      save();
    }
  });

  initFirebaseSync();

})();
</script>
</body>
</html>
